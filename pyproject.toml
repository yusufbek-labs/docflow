[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.1.0"
description = "Turn a folder of PDF invoices into structured data, filled Word documents and an Excel summary."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pdfplumber>=0.11",
    "docxtpl>=0.16",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "pillow>=10", "python-docx>=1.1"]

[project.scripts]
docflow = "docflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
